<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balatro Genie</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

:root {
  --bg:        #0a0a0a;
  --surface:   #111111;
  --border:    #222222;
  --gold:      #e8b84b;
  --gold-dim:  #7a5e1a;
  --red:       #c0392b;
  --red-dim:   #5c1a14;
  --text:      #d4cfc8;
  --dim:       #5a5550;
  --input-bg:  #161616;
  --felt:      #0e1f15;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
}

body {
  font-family: 'Fredoka', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
header {
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.wordmark {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.04em;
}

.wordmark span {
  color: var(--dim);
  font-weight: 400;
}

.header-status {
  font-size: 0.8rem;
  color: var(--dim);
}

/* ── Main layout ── */
main {
  flex: 1;
  display: grid;
  grid-template-columns: 420px 1fr;
  min-height: 0;
}

/* ── Left panel: form ── */
.panel-form {
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 2.5rem 2rem;
  gap: 2rem;
  overflow-y: auto;
}

.panel-title {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--dim);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.field-label {
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--dim);
}

.field-hint {
  font-size: 0.75rem;
  color: var(--dim);
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
  margin-top: -0.25rem;
}

input {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.65rem 0.85rem;
  color: var(--text);
  font-family: inherit;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  width: 100%;
}

input:focus {
  border-color: var(--gold-dim);
  box-shadow: 0 0 0 3px rgba(232, 184, 75, 0.08);
}

input::placeholder { color: var(--dim); }

.joker-wrap {
  position: relative;
}

#joker-dropdown {
  position: absolute;
  top: calc(100% + 2px);
  left: 0;
  right: 0;
  max-height: 220px;
  overflow-y: auto;
  background: #1a1a1a;
  border: 1px solid var(--gold-dim);
  border-radius: 6px;
  z-index: 20;
  display: none;
}

#joker-dropdown.open { display: block; }

.joker-option {
  padding: 0.55rem 0.85rem;
  cursor: pointer;
  font-size: 0.9rem;
  color: var(--text);
  border-bottom: 1px solid var(--border);
}

.joker-option:last-child { border-bottom: none; }

.joker-option:hover,
.joker-option.active {
  background: rgba(232, 184, 75, 0.1);
  color: var(--gold);
}

/* ── Wish button ── */
.wish-btn {
  background: var(--gold);
  border: none;
  border-radius: 6px;
  padding: 0.8rem 1.25rem;
  color: #0a0a0a;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: 0.03em;
  margin-top: 0.5rem;
}

.wish-btn:hover:not(:disabled) {
  opacity: 0.88;
  transform: translateY(-1px);
}

.wish-btn:active:not(:disabled) {
  transform: translateY(0);
}

.wish-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.wish-btn.searching {
  background: var(--gold-dim);
  color: var(--gold);
  animation: shimmer 1.4s ease-in-out infinite;
}

@keyframes shimmer {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* ── Status line ── */
#boot-status {
  font-size: 0.8rem;
  color: var(--dim);
  min-height: 1.2em;
}

/* ── Right panel: result ── */
.panel-result {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem 2rem;
  background: var(--felt);
  position: relative;
  overflow: hidden;
}

/* subtle felt grid */
.panel-result::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.result-empty {
  text-align: center;
  color: var(--dim);
}

.result-empty-glyph {
  font-size: 3.5rem;
  opacity: 0.2;
  margin-bottom: 1rem;
  display: block;
}

.result-empty-text {
  font-size: 0.85rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* the card */
.result-card {
  position: relative;
  background: var(--surface);
  border: 2px solid var(--gold-dim);
  border-radius: 12px;
  padding: 2.5rem 3rem;
  min-width: 320px;
  max-width: 480px;
  text-align: center;
  animation: card-in 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow:
    0 0 0 1px rgba(232, 184, 75, 0.06),
    0 20px 60px rgba(0, 0, 0, 0.6),
    0 0 40px rgba(232, 184, 75, 0.07);
}

/* corner pips */
.result-card::before,
.result-card::after {
  content: '★';
  position: absolute;
  font-size: 0.7rem;
  color: var(--gold-dim);
}
.result-card::before { top: 0.7rem; left: 0.9rem; }
.result-card::after  { bottom: 0.7rem; right: 0.9rem; transform: rotate(180deg); }

@keyframes card-in {
  from { opacity: 0; transform: translateY(16px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.result-overline {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 1rem;
}

.result-seed {
  font-size: 2.8rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.2em;
  font-family: 'Courier New', monospace;
  line-height: 1;
  margin-bottom: 1.5rem;
}

.result-divider {
  height: 1px;
  background: var(--border);
  margin: 0 auto 1.5rem;
  width: 60%;
}

.result-joker {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0.35rem;
}

.result-note {
  font-size: 0.8rem;
  color: var(--dim);
  margin-bottom: 1rem;
}

.result-time {
  font-size: 0.7rem;
  color: var(--dim);
  letter-spacing: 0.06em;
}

/* error */
.error-card {
  background: var(--surface);
  border: 1px solid var(--red-dim);
  border-radius: 8px;
  padding: 1.25rem 1.5rem;
  font-size: 0.88rem;
  color: #e07070;
  line-height: 1.55;
  max-width: 420px;
  animation: card-in 0.3s ease;
}

/* ── Responsive collapse ── */
@media (max-width: 740px) {
  main {
    grid-template-columns: 1fr;
  }

  .panel-form {
    border-right: none;
    border-bottom: 1px solid var(--border);
  }

  .panel-result {
    min-height: 300px;
  }
}
</style>
</head>
<body>

<header>
  <div class="wordmark">Balatro <span>Genie</span></div>
  <div class="header-status" id="header-status"></div>
</header>

<main>
  <section class="panel-form" aria-label="Wish form">
    <div class="panel-title">Make a Wish</div>

    <div class="field">
      <label class="field-label" for="joker-input">Joker</label>
      <div class="joker-wrap">
        <input type="text" id="joker-input" placeholder="Blueprint, DNA, Perkeo..." autocomplete="off">
        <div id="joker-dropdown" role="listbox"></div>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="name-input">Seed keyword <span class="field-hint">optional — baked into the seed</span></label>
      <input type="text" id="name-input" placeholder="up to 7 chars — e.g. ADAM" maxlength="7">
    </div>

    <button class="wish-btn" id="wish-btn" disabled>Loading engine...</button>
    <div id="boot-status" aria-live="polite"></div>
  </section>

  <section class="panel-result" aria-label="Result" aria-live="polite">
    <div id="result-area">
      <div class="result-empty">
        <span class="result-empty-glyph">&#9824;</span>
        <div class="result-empty-text">Your seed will appear here</div>
      </div>
    </div>
  </section>
</main>

<script type="module">
import bootsharp, { MotelyJaml, MotelySearch } from "motely-wasm";

const JOKERS = [
  "Joker","Greedy Joker","Lusty Joker","Wrathful Joker","Gluttonous Joker",
  "Jolly Joker","Zany Joker","Mad Joker","Crazy Joker","Droll Joker",
  "Sly Joker","Wily Joker","Clever Joker","Devious Joker","Crafty Joker",
  "Half Joker","Credit Card","Banner","Mystic Summit","8 Ball",
  "Misprint","Raised Fist","Chaos the Clown","Scary Face","Abstract Joker",
  "Delayed Gratification","Gros Michel","Even Steven","Odd Todd","Scholar",
  "Business Card","Supernova","Ride the Bus","Egg","Runner",
  "Ice Cream","Splash","Blue Joker","Faceless Joker","Green Joker",
  "Superposition","To Do List","Cavendish","Red Card","Square Joker",
  "Riff-Raff","Photograph","Reserved Parking","Mail-In Rebate","Hallucination",
  "Fortune Teller","Juggler","Drunkard","Golden Joker","Popcorn",
  "Walkie Talkie","Smiley Face","Golden Ticket","Swashbuckler","Hanging Chad",
  "Shoot the Moon","Joker Stencil","Four Fingers","Mime","Ceremonial Dagger",
  "Marble Joker","Loyalty Card","Dusk","Fibonacci","Steel Joker",
  "Hack","Pareidolia","Space Joker","Burglar","Blackboard",
  "Sixth Sense","Constellation","Hiker","Card Sharp","Madness",
  "Séance","Vampire","Shortcut","Hologram","Cloud 9",
  "Rocket","Midas Mask","Luchador","Gift Card","Turtle Bean",
  "Erosion","To the Moon","Stone Joker","Lucky Cat","Bull",
  "Diet Cola","Trading Card","Flash Card","Spare Trousers","Ramen",
  "Seltzer","Castle","Mr. Bones","Acrobat","Sock and Buskin",
  "Troubadour","Certificate","Smeared Joker","Throwback","Rough Gem",
  "Bloodstone","Arrowhead","Onyx Agate","Glass Joker","Showman",
  "Flower Pot","Merry Andy","Oops! All 6s","The Idol","Seeing Double",
  "Matador","Satellite","Cartomancer","Astronomer","Bootstraps",
  "DNA","Vagabond","Baron","Obelisk","Baseball Card",
  "Ancient Joker","Campfire","Blueprint","Wee Joker","Hit the Road",
  "The Duo","The Trio","The Family","The Order","The Tribe",
  "Stuntman","Invisible Joker","Brainstorm","Driver's License","Burnt Joker",
  "Canio","Triboulet","Yorick","Chicot","Perkeo"
];

const DISPLAY_TO_JAML = {};
JOKERS.forEach(j => {
  let pascal = j.replace(/[^a-zA-Z0-9 ]/g, "").split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join("");
  if (j === "8 Ball") pascal = "EightBall";
  if (j === "Chaos the Clown") pascal = "ChaostheClown";
  if (j === "Oops! All 6s") pascal = "OopsAll6s";
  if (j === "Riff-Raff") pascal = "RiffRaff";
  if (j === "Mail-In Rebate") pascal = "MailInRebate";
  if (j === "Mr. Bones") pascal = "MrBones";
  if (j === "Driver's License") pascal = "DriversLicense";
  if (j === "Séance") pascal = "Seance";
  DISPLAY_TO_JAML[j] = pascal;
});

const jokerInput   = document.getElementById("joker-input");
const dropdown     = document.getElementById("joker-dropdown");
const nameInput    = document.getElementById("name-input");
const wishBtn      = document.getElementById("wish-btn");
const bootStatus   = document.getElementById("boot-status");
const resultArea   = document.getElementById("result-area");
const headerStatus = document.getElementById("header-status");

let selectedJoker = null;
let activeIdx = -1;

function renderDropdown(filter) {
  const matches = filter
    ? JOKERS.filter(j => j.toLowerCase().includes(filter.toLowerCase())).slice(0, 12)
    : JOKERS.slice(0, 12);

  if (matches.length === 0) {
    dropdown.classList.remove("open");
    return;
  }

  activeIdx = -1;
  dropdown.innerHTML = matches.map((j, i) =>
    `<div class="joker-option" role="option" data-joker="${j}" data-idx="${i}">${j}</div>`
  ).join("");
  dropdown.classList.add("open");

  dropdown.querySelectorAll(".joker-option").forEach(el => {
    el.addEventListener("mousedown", (e) => {
      e.preventDefault();
      pick(el.dataset.joker);
    });
  });
}

function pick(joker) {
  selectedJoker = joker;
  jokerInput.value = joker;
  dropdown.classList.remove("open");
}

jokerInput.addEventListener("focus", () => renderDropdown(jokerInput.value));
jokerInput.addEventListener("input", () => {
  selectedJoker = null;
  renderDropdown(jokerInput.value);
});
jokerInput.addEventListener("blur", () => {
  setTimeout(() => dropdown.classList.remove("open"), 150);
});
jokerInput.addEventListener("keydown", (e) => {
  const items = dropdown.querySelectorAll(".joker-option");
  if (!items.length) return;

  if (e.key === "ArrowDown") {
    e.preventDefault();
    activeIdx = Math.min(activeIdx + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle("active", i === activeIdx));
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    activeIdx = Math.max(activeIdx - 1, 0);
    items.forEach((el, i) => el.classList.toggle("active", i === activeIdx));
  } else if (e.key === "Enter" && activeIdx >= 0) {
    e.preventDefault();
    pick(items[activeIdx].dataset.joker);
  }
});

nameInput.addEventListener("input", () => {
  // Balatro's seed alphabet is 1-9 + A-Z: no zero, so map 0 → O
  nameInput.value = nameInput.value.toUpperCase().replace(/0/g, "O").replace(/[^A-Z1-9]/g, "");
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
}

function resolveJoker(text) {
  const norm = s => s.normalize("NFD").toLowerCase().replace(/[^a-z0-9]/g, "");
  const t = norm(text);
  if (!t) return null;
  const exact = JOKERS.find(j => norm(j) === t);
  if (exact) return exact;
  const partial = JOKERS.filter(j => norm(j).includes(t));
  return partial.length === 1 ? partial[0] : null;
}

headerStatus.textContent = "loading engine...";
bootStatus.textContent = "waking the genie...";
try {
  await bootsharp.boot();
  bootStatus.textContent = "";
  headerStatus.textContent = "ready";
  wishBtn.textContent = "Make a Wish";
  wishBtn.disabled = false;
} catch (e) {
  bootStatus.textContent = "";
  headerStatus.textContent = "engine failed";
  wishBtn.textContent = "Engine failed to load";
  resultArea.innerHTML = `<div class="error-card">The genie's lamp is cracked: ${esc(e.message || e)}<br>Reload the page to try again.</div>`;
  throw e;
}

const ALPHABET = "123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const SEED_LEN = 8;
const CANDIDATE_CAP = 50000;

function candidateSeeds(name, cap) {
  const padLen = SEED_LEN - name.length;
  const positions = padLen + 1;
  const total = positions * Math.pow(ALPHABET.length, padLen);
  const seeds = new Set();

  if (total <= cap) {
    const padCount = Math.pow(ALPHABET.length, padLen);
    for (let pos = 0; pos < positions; pos++) {
      for (let i = 0; i < padCount; i++) {
        let x = i, pad = "";
        for (let d = 0; d < padLen; d++) {
          pad += ALPHABET[x % ALPHABET.length];
          x = Math.floor(x / ALPHABET.length);
        }
        seeds.add(pad.slice(0, pos) + name + pad.slice(pos));
      }
    }
    return { seeds: [...seeds], exhaustive: true };
  }

  let guard = cap * 3;
  while (seeds.size < cap && guard-- > 0) {
    const pos = Math.floor(Math.random() * positions);
    let pad = "";
    for (let d = 0; d < padLen; d++) {
      pad += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
    }
    seeds.add(pad.slice(0, pos) + name + pad.slice(pos));
  }
  return { seeds: [...seeds], exhaustive: false };
}

function buildJaml(pascal, antes, seedList) {
  return [
    `name: Genie Wish`,
    `deck: Red`,
    `stake: White`,
    seedList ? `seeds: [${seedList.join(", ")}]` : ``,
    `must:`,
    `  - joker: ${pascal}`,
    `    antes: [${antes.join(", ")}]`,
  ].filter(Boolean).join("\n");
}

async function searchSeedList(seedList, pascal, antes) {
  const CHUNK = 2500;
  for (let i = 0; i < seedList.length; i += CHUNK) {
    const config = MotelyJaml.fromJaml(buildJaml(pascal, antes, seedList.slice(i, i + CHUNK)));
    const results = await MotelySearch.searchList(config);
    if (results.length > 0) return results;
    bootStatus.textContent = `checked ${Math.min(i + CHUNK, seedList.length).toLocaleString()} of ${seedList.length.toLocaleString()} seeds...`;
  }
  return [];
}

wishBtn.addEventListener("click", async () => {
  const typed = jokerInput.value.trim();
  if (!selectedJoker && !typed) {
    jokerInput.focus();
    return;
  }

  const joker = selectedJoker || resolveJoker(typed);
  if (!joker) {
    resultArea.innerHTML = `<div class="error-card">Unknown joker: "${esc(typed)}" — pick one from the list.</div>`;
    return;
  }
  const pascal = DISPLAY_TO_JAML[joker];
  const keyword = nameInput.value.trim();

  wishBtn.disabled = true;
  wishBtn.textContent = "Searching...";
  wishBtn.classList.add("searching");
  resultArea.innerHTML = "";
  headerStatus.textContent = "searching...";

  const onProgress = p => {
    const m = Number(p.seedsSearched) / 1e6;
    if (m >= 0.1) {
      wishBtn.textContent = `${m.toFixed(1)}M seeds checked`;
      headerStatus.textContent = `${m.toFixed(1)}M seeds`;
    }
  };
  MotelySearch.onProgress.subscribe(onProgress);

  const t0 = performance.now();

  try {
    let results;
    let anteNote = "guaranteed in antes 1–2";

    if (keyword) {
      const { seeds, exhaustive } = candidateSeeds(keyword, CANDIDATE_CAP);
      bootStatus.textContent = exhaustive
        ? `${seeds.length.toLocaleString()} seeds can contain "${keyword}" — checking all...`
        : `checking ${seeds.length.toLocaleString()} seeds containing "${keyword}"...`;

      results = await searchSeedList(seeds, pascal, [1, 2]);

      if (results.length === 0 && exhaustive) {
        bootStatus.textContent = `none in antes 1–2 — widening to antes 1–8...`;
        results = await searchSeedList(seeds, pascal, [1, 2, 3, 4, 5, 6, 7, 8]);
        anteNote = "appears within antes 1–8";
      }

      if (results.length === 0) {
        const detail = exhaustive
          ? `All ${seeds.length.toLocaleString()} seeds containing "${esc(keyword)}" checked — none has ${esc(joker)} even by ante 8. Try fewer letters.`
          : `Checked ${seeds.length.toLocaleString()} seeds containing "${esc(keyword)}" — no ${esc(joker)} in antes 1–2. Wish again for a fresh batch, or try fewer letters.`;
        resultArea.innerHTML = `<div class="error-card">${detail}</div>`;
      }
    } else {
      const config = MotelyJaml.fromJaml(buildJaml(pascal, [1, 2]));
      results = await MotelySearch.findOne(config);
      if (results.length === 0) {
        resultArea.innerHTML = `<div class="error-card">The genie found nothing — try again or pick a different joker.</div>`;
      }
    }

    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);

    if (results && results.length > 0) {
      const best = results.reduce((a, b) => a.score >= b.score ? a : b);
      resultArea.innerHTML = `
        <div class="result-card">
          <div class="result-overline">Your Seed</div>
          <div class="result-seed">${esc(best.seed)}</div>
          <div class="result-divider"></div>
          <div class="result-joker">${esc(joker)}</div>
          <div class="result-note">${anteNote}</div>
          <div class="result-time">found in ${elapsed}s</div>
        </div>
      `;
    }
  } catch (e) {
    resultArea.innerHTML = `<div class="error-card">${esc(e.message || e)}</div>`;
  }

  MotelySearch.onProgress.unsubscribe(onProgress);
  bootStatus.textContent = "";
  headerStatus.textContent = "ready";
  wishBtn.classList.remove("searching");
  wishBtn.textContent = "Make a Wish";
  wishBtn.disabled = false;
});
</script>
</body>
</html>
