<body>
<div id="root"></div>
<div class="grain" aria-hidden="true"></div>

<script type="module">
import { createElement, useCallback, useEffect, useRef, useState } from "react";
import { createRoot } from "react-dom/client";
import htm from "htm";
import bootsharp, { MotelyJaml, MotelySearch, MotelyUtilities } from "motely-wasm";

// htm binds to a hyperscript fn — React.createElement — so we get JSX-like
// markup with no build step.
const html = htm.bind(createElement);

// ---------------------------------------------------------------------------
// seeds: read / strip / write the top-level `seeds:` list in a JAML filter.
// We manage it ourselves so the search can re-score saved seeds first and write
// the best finds back. Always stripped before fromJaml; supplied via config.seeds.
// ---------------------------------------------------------------------------
const STRIP_QUOTES = /^["']|["']$/g;
const ZONE_KEY = /^\s*(must|should|mustNot)\s*:/;

function parseSeeds(jaml) {
  const lines = jaml.split(/\r?\n/);
  const seeds = [];
  for (let i = 0; i < lines.length; i++) {
    const header = lines[i].match(/^\s*seeds\s*:\s*(.*)$/);
    if (!header) continue;
    const inline = header[1].trim();
    if (inline.startsWith("[")) {
      let buf = inline, j = i;
      while (!buf.includes("]") && j + 1 < lines.length) { j++; buf += " " + lines[j].trim(); }
      const inner = buf.slice(buf.indexOf("[") + 1, buf.lastIndexOf("]"));
      for (const tok of inner.split(",")) {
        const s = tok.trim().replace(STRIP_QUOTES, "").toUpperCase();
        if (s) seeds.push(s);
      }
    } else {
      for (let k = i + 1; k < lines.length; k++) {
        const item = lines[k].match(/^\s*-\s*(.+?)\s*$/);
        if (!item) break;
        const s = item[1].replace(STRIP_QUOTES, "").toUpperCase();
        if (s) seeds.push(s);
      }
    }
    break;
  }
  return [...new Set(seeds)];
}

function stripSeeds(jaml) {
  const lines = jaml.split(/\r?\n/);
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const header = lines[i].match(/^\s*seeds\s*:\s*(.*)$/);
    if (!header) { out.push(lines[i]); continue; }
    const inline = header[1].trim();
    if (inline.startsWith("[")) {
      let buf = inline;
      while (!buf.includes("]") && i + 1 < lines.length) { i++; buf += lines[i]; }
    } else {
      while (i + 1 < lines.length && /^\s*-\s+/.test(lines[i + 1])) i++;
    }
  }
  return out.join("\n");
}

function writeSeeds(jaml, seeds) {
  const base = stripSeeds(jaml).replace(/\n{3,}/g, "\n\n").trimEnd();
  if (seeds.length === 0) return base + "\n";
  const flow = `seeds: [${seeds.join(", ")}]`;
  const lines = base.split(/\r?\n/);
  const zoneIdx = lines.findIndex((l) => ZONE_KEY.test(l));
  if (zoneIdx === -1) return base + "\n" + flow + "\n";
  lines.splice(zoneIdx, 0, flow);
  return lines.join("\n") + "\n";
}

function readName(jaml) {
  const m = jaml.match(/^\s*name\s*:\s*(.+?)\s*$/m);
  return m ? (m[1].replace(STRIP_QUOTES, "").trim() || null) : null;
}

// ---------------------------------------------------------------------------
// engine: boot + two-phase search (seedlist re-score, then full sweep), keeping
// the best MAX_BEST seeds by score for the ratchet.
// ---------------------------------------------------------------------------
let bootPromise = null;
function bootEngine() {
  if (bootPromise) return bootPromise;
  bootPromise = (async () => {
    // Embedded build: WASM is base64-inlined, boot() takes no args.
    if (bootsharp.getStatus() === bootsharp.BootStatus.Standby) await bootsharp.boot();
  })();
  return bootPromise;
}

// jaml-lang supplies line numbers; MotelyJaml.validate is the authority. Loaded
// lazily so a CDN hiccup costs the line numbers and nothing else.
let getDiagnostics = null;
let jamlLangTried = false;
async function loadJamlLang() {
  if (jamlLangTried) return;
  jamlLangTried = true;
  try {
    const m = await import("jaml-lang");
    getDiagnostics = m.getDiagnostics;
  } catch (_) { /* line numbers unavailable; the engine still reports the error */ }
}

function validateJaml(jaml) {
  // Line-numbered structural lint first, over the full editor text so the
  // numbers match what's on screen.
  if (getDiagnostics) {
    try {
      const errs = getDiagnostics(jaml).filter((d) => d.severity === 1);
      if (errs.length > 0) {
        return errs.slice(0, 5).map((d) => `line ${d.range.start.line + 1}: ${d.message}`).join("\n");
      }
    } catch (_) { /* fall through to the engine */ }
  }
  // Engine check. validate() returns the message (or null), so the opaque
  // "C# exception from NativeAOT" this used to catch is gone.
  try { return MotelyJaml.validate(stripSeeds(jaml)); }
  catch (e) { return e instanceof Error ? e.message : String(e); }
}

const MAX_BEST = 3141; // π.
// Balatro seeds: 8 chars over a 35-char alphabet -> 35^8 ~ 2.25 trillion.
const BATCH_CHARS = 3;
const TOTAL_BATCHES = Math.pow(35, 8 - BATCH_CHARS); // 35^5 = 52,521,875
const SEEDS_PER_BATCH = Math.pow(35, BATCH_CHARS);   // 35^3 = 42,875
const BATCHES_PER_RANGE = 4;

function runSearch(jaml, cb) {
  const presetSeeds = parseSeeds(jaml);
  const base = MotelyJaml.fromJaml(stripSeeds(jaml));
  let stopped = false;

  let best = new Map();
  let lastBestEmit = 0;
  const topSeeds = () =>
    [...best.entries()].sort((a, b) => b[1] - a[1]).slice(0, MAX_BEST).map(([s]) => s);
  const emitBest = (force) => {
    const now = performance.now();
    if (!force && now - lastBestEmit < 1500) return;
    lastBestEmit = now;
    const top = topSeeds();
    if (best.size > MAX_BEST) best = new Map(top.map((s) => [s, best.get(s)]));
    cb.onBest(top);
  };

  const onScored = (r) => {
    const prev = best.get(r.seed);
    if (prev === undefined || r.score > prev) best.set(r.seed, r.score);
    cb.onHit({ seed: r.seed, score: r.score });
    emitBest(false);
  };
  MotelySearch.onScoredResult.subscribe(onScored);

  // v25's search calls resolve to a result array rather than carrying the
  // counters, so scanned/hits come from onProgress. Batch arithmetic is the
  // floor for scanned, so the readout still climbs between progress ticks.
  let scanned = 0, hits = 0, enginePerSecond = 0;
  const onProgress = (p) => {
    scanned = Math.max(scanned, Number(p.seedsSearched));
    hits = Math.max(hits, Number(p.matchingSeeds));
    enginePerSecond = Math.round((p.seedsPerMillisecond || 0) * 1000);
  };
  MotelySearch.onProgress.subscribe(onProgress);

  const done = (async () => {
    const started = performance.now();
    const report = () => {
      const sec = (performance.now() - started) / 1000;
      const derived = sec > 0 ? Math.round(scanned / sec) : 0;
      cb.onProgress({ scanned, hits, seedsPerSecond: enginePerSecond || derived });
    };
    try {
      // Phase 1 — re-score the seeds already saved in the filter.
      if (presetSeeds.length > 0 && !stopped) {
        cb.onPhase("seedlist");
        await new Promise((res) => setTimeout(res, 0));
        const found = await MotelySearch.searchList({ ...base, seeds: presetSeeds });
        scanned = Math.max(scanned, presetSeeds.length);
        hits = Math.max(hits, found.length);
        report(); emitBest(true);
      }
      // Phase 2 — continue sweeping the full space.
      const config = { ...base, seeds: [] };
      cb.onPhase("sweep");
      let cursor = Math.floor(Math.random() * TOTAL_BATCHES);
      let covered = 0;
      while (covered < TOTAL_BATCHES && !stopped) {
        await new Promise((res) => setTimeout(res, 0)); // yield: paint + Stop land
        const end = Math.min(cursor + BATCHES_PER_RANGE, TOTAL_BATCHES);
        // No cutoff flag and no progress-interval tick in v25 — the call that
        // used to suppress every hit on a must-only filter cannot be
        // mis-parameterised any more.
        await MotelySearch.searchSequential(config, BigInt(cursor), BigInt(end), BATCH_CHARS);
        covered += end - cursor;
        scanned = Math.max(scanned, covered * SEEDS_PER_BATCH);
        cursor = end >= TOTAL_BATCHES ? 0 : end;
        report();
      }
    } finally {
      MotelySearch.onScoredResult.unsubscribe(onScored);
      MotelySearch.onProgress.unsubscribe(onProgress);
      report(); emitBest(true);
    }
  })();

  return { done, stop: () => { stopped = true; } };
}

// ---------------------------------------------------------------------------
// 🎲 Magic: aesthetic search. MotelyUtilities hands back the keyword list for an
// aesthetic as a plain array, so we slice it into chunks and score each chunk
// with searchList — the UI keeps painting and Stop lands between chunks. The
// Web Worker this used to need is gone along with the one-shot synchronous
// enumeration that forced it.
// ---------------------------------------------------------------------------
const AESTHETICS = [
  { name: "Palindrome", keywords: () => MotelyUtilities.mirrorPatternKeywords(8) },
  { name: "Repeater", keywords: () => MotelyUtilities.repeatCharKeywords(4) },
  { name: "Step", keywords: () => MotelyUtilities.ascendingDigitLetterKeywords(8) },
  { name: "Gross", keywords: () => MotelyUtilities.grossKeywords() },
  { name: "Funny", keywords: () => MotelyUtilities.funnyKeywords() },
  { name: "Balatro", keywords: () => MotelyUtilities.balatroKeywords() },
];
const MAGIC_CHUNK = 4096;

function runMagicSearch(jaml, aesthetic, cb) {
  const base = MotelyJaml.fromJaml(stripSeeds(jaml));
  let stopped = false;

  let best = new Map();
  let lastBestEmit = 0;
  const emitBest = (force) => {
    const now = performance.now();
    if (!force && now - lastBestEmit < 1500) return;
    lastBestEmit = now;
    const top = [...best.entries()].sort((a, b) => b[1] - a[1]).slice(0, MAX_BEST).map(([s]) => s);
    if (best.size > MAX_BEST) best = new Map(top.map((s) => [s, best.get(s)]));
    cb.onBest(top);
  };

  const onScored = (r) => {
    const prev = best.get(r.seed);
    if (prev === undefined || r.score > prev) best.set(r.seed, r.score);
    cb.onHit({ seed: r.seed, score: r.score });
    emitBest(false);
  };
  MotelySearch.onScoredResult.subscribe(onScored);

  const done = (async () => {
    let scanned = 0, hits = 0;
    const started = performance.now();
    const report = () => {
      const sec = (performance.now() - started) / 1000;
      cb.onProgress({ scanned, hits, seedsPerSecond: sec > 0 ? Math.round(scanned / sec) : 0 });
    };
    try {
      const keywords = aesthetic.keywords();
      for (let i = 0; i < keywords.length && !stopped; i += MAGIC_CHUNK) {
        await new Promise((res) => setTimeout(res, 0)); // yield: paint + Stop land
        const chunk = keywords.slice(i, i + MAGIC_CHUNK);
        const found = await MotelySearch.searchList({ ...base, seeds: chunk });
        scanned += chunk.length;
        hits += found.length;
        report();
      }
    } catch (e) {
      cb.onError(e instanceof Error ? e.message : String(e));
    } finally {
      MotelySearch.onScoredResult.unsubscribe(onScored);
      report(); emitBest(true);
    }
  })();

  return { done, stop: () => { stopped = true; } };
}

// ---------------------------------------------------------------------------
// presets
// ---------------------------------------------------------------------------
const PRESETS = [
  { label: "Blueprint", jaml: `name: Blueprint Start\ndeck: Red\nstake: White\nmust:\n  - joker: Blueprint\n    antes: [1, 2]\n` },
  { label: "Perkeo + copies", jaml: `name: Perkeo Start\ndeck: Red\nstake: White\nmust:\n  - joker: Perkeo\n    antes: [1]\nshould:\n  - joker: Blueprint\n    antes: [1, 2, 3, 4]\n    score: 30\n  - joker: Brainstorm\n    antes: [1, 2, 3, 4]\n    score: 30\n` },
  { label: "Negative tag", jaml: `name: Early Negative\ndeck: Red\nstake: White\nmust:\n  - tag: NegativeTag\n    antes: [1, 2]\n` },
  { label: "Perkeo a1-3", jaml: `name: Perkeo Required\ndeck: Red\nstake: White\nmust:\n  - joker: Perkeo\n    antes: [1, 2, 3]\nshould:\n  - joker: Blueprint\n    antes: [1, 2, 3, 4]\n    score: 20\n  - joker: Brainstorm\n    antes: [1, 2, 3, 4]\n    score: 20\n` },
];
const DEFAULT_JAML = PRESETS[0].jaml;
const MAX_ROWS = 50;

// Bounded top-N for the results list. A loose must-only filter emits hits about
// as fast as the engine scans, so collecting every hit and sorting the whole
// pile on each paint is what stalls the UI. Hold MAX_ROWS rows, sorted, and
// keep the best score per seed so each row stays unique (phase 1 re-scores
// saved seeds that the sweep can surface again).
function topRows(limit) {
  const rows = [];
  const sort = () => rows.sort((a, b) => b.score - a.score);
  return {
    add(hit) {
      const at = rows.findIndex((r) => r.seed === hit.seed);
      if (at >= 0) {
        if (hit.score > rows[at].score) { rows[at] = hit; sort(); }
        return;
      }
      if (rows.length === limit && hit.score <= rows[limit - 1].score) return;
      rows.push(hit);
      sort();
      if (rows.length > limit) rows.length = limit;
    },
    snapshot: () => rows.slice(),
  };
}

// ---------------------------------------------------------------------------
// App
// ---------------------------------------------------------------------------
function App() {
  const [boot, setBoot] = useState("booting");
  const [bootError, setBootError] = useState(null);
  const [jaml, setJaml] = useState(DEFAULT_JAML);
  const [running, setRunning] = useState(false);
  const [phase, setPhase] = useState(null);
  const [magic, setMagic] = useState(null);
  const [error, setError] = useState(null);
  const [results, setResults] = useState([]);
  const [stats, setStats] = useState({ scanned: 0, hits: 0, seedsPerSecond: 0 });
  const [peakSpeed, setPeakSpeed] = useState(0);
  const [bestCount, setBestCount] = useState(0);
  const [copied, setCopied] = useState(null);

  const handleRef = useRef(null);
  const fileRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    loadJamlLang(); // best-effort; enables friendly JAML error messages
    bootEngine().then(
      () => { if (!cancelled) setBoot("ready"); },
      (e) => { if (!cancelled) { setBoot("error"); setBootError(e instanceof Error ? e.message : String(e)); } },
    );
    return () => { cancelled = true; handleRef.current?.stop(); };
  }, []);

  const onSearch = useCallback(async () => {
    if (boot !== "ready" || running) return;
    const v = validateJaml(jaml);
    if (v) { setError(v); return; }
    setError(null); setResults([]); setStats({ scanned: 0, hits: 0, seedsPerSecond: 0 }); setPeakSpeed(0); setRunning(true);

    const rows = topRows(MAX_ROWS);
    let lastPaint = 0;
    const paint = (force) => {
      const now = performance.now();
      if (!force && now - lastPaint < 120) return;
      lastPaint = now;
      setResults(rows.snapshot());
    };

    try {
      const handle = runSearch(jaml, {
        onHit: (hit) => { rows.add(hit); paint(false); },
        onProgress: (s) => { setStats(s); setPeakSpeed((p) => Math.max(p, s.seedsPerSecond)); },
        onPhase: setPhase,
        onBest: (seeds) => { setBestCount(seeds.length); setJaml((prev) => writeSeeds(prev, seeds)); },
      });
      handleRef.current = handle;
      await handle.done;
      paint(true);
    } catch (e) {
      setError(e instanceof Error ? e.message : String(e));
    } finally {
      handleRef.current = null; setPhase(null); setRunning(false);
    }
  }, [boot, running, jaml]);

  const onMagic = useCallback(async () => {
    if (boot !== "ready" || running) return;
    const v = validateJaml(jaml);
    if (v) { setError(v); return; }
    const pick = AESTHETICS[Math.floor(Math.random() * AESTHETICS.length)];
    setError(null); setResults([]); setStats({ scanned: 0, hits: 0, seedsPerSecond: 0 }); setPeakSpeed(0);
    setMagic(pick.name); setRunning(true);

    const rows = topRows(MAX_ROWS);
    let lastPaint = 0;
    const paint = (force) => {
      const now = performance.now();
      if (!force && now - lastPaint < 120) return;
      lastPaint = now;
      setResults(rows.snapshot());
    };

    try {
      const handle = runMagicSearch(jaml, pick, {
        onHit: (hit) => { rows.add(hit); paint(false); },
        onProgress: (s) => { setStats(s); setPeakSpeed((p) => Math.max(p, s.seedsPerSecond)); },
        onBest: (seeds) => { setBestCount(seeds.length); setJaml((prev) => writeSeeds(prev, seeds)); },
        onError: (m) => setError(m),
      });
      handleRef.current = handle;
      await handle.done;
      paint(true);
    } catch (e) {
      setError(e instanceof Error ? e.message : String(e));
    } finally {
      handleRef.current = null; setMagic(null); setRunning(false);
    }
  }, [boot, running, jaml]);

  const onStop = useCallback(() => { handleRef.current?.stop(); }, []);

  const onLoadFile = useCallback((e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { setJaml(String(reader.result ?? "")); setBestCount(0); setResults([]); setError(null); };
    reader.readAsText(file);
  }, []);

  const onSaveFile = useCallback(() => {
    const blob = new Blob([jaml], { type: "text/yaml" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${(readName(jaml) ?? "balatro-filter").replace(/[^\w.-]+/g, "-")}.jaml`;
    // Firefox fires a programmatic click only for an anchor that is in the
    // document, and revoking the blob URL in the same tick as click() cancels
    // the download in flight. Attach first, release on the next macrotask.
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 0);
  }, [jaml]);

  const onCopy = useCallback((seed) => {
    navigator.clipboard?.writeText(seed).then(
      () => { setCopied(seed); setTimeout(() => setCopied((s) => (s === seed ? null : s)), 1200); },
      () => {},
    );
  }, []);

  const statusLabel = boot === "booting" ? "booting engine…"
    : boot === "error" ? "engine error"
    : running ? (magic ? "✨ " + magic + " magic" : phase === "seedlist" ? "re-scoring saved seeds" : "sweeping")
    : "ready";
  const statusTone = boot === "error" ? "red" : running ? "orange" : boot === "ready" ? "green" : "grey";

  return html`
    <main className="app">
      <header className="head">
        <h1 className="title"><span className="genie">🧞</span> Balatro Genie</h1>
        <p className="tagline">lo-fi seed search · 2.25 trillion seeds, all in your browser 🎧</p>
        <a className="sitebanner" href="https://seedfinder.app" target="_blank" rel="noreferrer">🔮 seedfinder.app</a>
      </header>

      <div className="speedhero">
        <div className="speedhero-label">${running ? "⚡ seeds / sec" : "⚡ ready to grind"}</div>
        <div className=${"speedhero-num" + (running ? "" : " idle")}>${stats.seedsPerSecond.toLocaleString()}</div>
        <div className="speedhero-peak">peak <b>${peakSpeed.toLocaleString()}</b>/s this run</div>
      </div>

      <div className="statusbar">
        <span className=${"badge badge-" + statusTone}>${running ? html`<span className="spin">🌀</span> ` : ""}${statusLabel}</span>
        <span className="badge badge-purple">${stats.hits.toLocaleString()} hits</span>
        <span className="badge badge-gold">★ ${bestCount.toLocaleString()}/${MAX_BEST}</span>
      </div>

      <div className="toolbar">
        <button type="button" className="chip" disabled=${running} onClick=${() => fileRef.current?.click()}>📂 Load .jaml</button>
        <button type="button" className="chip" onClick=${onSaveFile}>💾 Save .jaml</button>
        <input ref=${fileRef} type="file" accept=".jaml,.yaml,.yml,.txt,text/yaml" hidden onChange=${onLoadFile} />
      </div>

      <div className="presets">
        ${PRESETS.map((p) => html`
          <button key=${p.label} type="button" className="chip" disabled=${running}
            onClick=${() => { setJaml(p.jaml); setBestCount(0); }}>${p.label}</button>`)}
      </div>

      <textarea className="editor" spellCheck=${false} value=${jaml} disabled=${running}
        onChange=${(e) => setJaml(e.target.value)} placeholder="Write a JAML filter…"></textarea>

      ${boot === "error" && bootError ? html`<p className="error">Engine failed to boot: ${bootError}</p>` : null}
      ${error ? html`<p className="error">${error}</p>` : null}

      ${running
        ? html`<button type="button" className="run run-stop" onClick=${onStop}>Stop</button>`
        : html`<div className="runrow">
            <button type="button" className="run" disabled=${boot !== "ready"} onClick=${onSearch}>${boot === "ready" ? "Search Seeds" : "Booting…"}</button>
            <button type="button" className="run run-magic" disabled=${boot !== "ready"} onClick=${onMagic} title="Search a random aesthetic: Palindrome · Repeater · Step · Gross · Funny · Balatro">🎲 Magic</button>
          </div>`}

      ${results.length > 0 ? html`
        <ul className="results">
          ${results.map((r) => html`
            <li key=${r.seed} className="seed" title="Click to copy" onClick=${() => onCopy(r.seed)}>
              <span className="seed-id">${r.seed}</span>
              <span className="seed-score">${copied === r.seed ? "copied!" : r.score}</span>
            </li>`)}
        </ul>` : null}

      <footer className="foot">
        <a className="foot-main" href="https://seedfinder.app" target="_blank" rel="noreferrer">🔮 seedfinder.app</a>
        · powered by <a href="https://www.npmjs.com/package/motely-wasm" target="_blank" rel="noreferrer">motely-wasm</a>
        · <a href="https://mcp.seedfinder.app/mcp" target="_blank" rel="noreferrer">JAML docs</a>
      </footer>
    </main>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
