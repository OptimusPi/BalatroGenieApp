<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Balatro Genie</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

:root {
  --bg: #0d0d1a;
  --card: #16132b;
  --glow: #b366ff;
  --gold: #ffd700;
  --red: #e94560;
  --text: #e8e0f0;
  --dim: #8878a0;
  --input-bg: #1e1a33;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Fredoka', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

.lamp {
  margin-top: 3rem;
  font-size: 5rem;
  animation: float 3s ease-in-out infinite;
  cursor: default;
  user-select: none;
  filter: drop-shadow(0 0 20px rgba(179, 102, 255, 0.5));
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

h1 {
  font-size: 2.5rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--glow), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin: 0.5rem 0 0.25rem;
}

.subtitle {
  color: var(--dim);
  font-size: 1rem;
  margin-bottom: 2rem;
}

.wish-box {
  background: var(--card);
  border: 1px solid rgba(179, 102, 255, 0.2);
  border-radius: 16px;
  padding: 2rem;
  width: 90%;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  box-shadow: 0 0 40px rgba(179, 102, 255, 0.08);
}

label {
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--dim);
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

input, select {
  background: var(--input-bg);
  border: 1px solid rgba(179, 102, 255, 0.25);
  border-radius: 10px;
  padding: 0.7rem 1rem;
  color: var(--text);
  font-family: inherit;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}

input:focus, select:focus {
  border-color: var(--glow);
}

input::placeholder { color: #5a5070; }

.joker-search-wrap {
  position: relative;
}

#joker-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  max-height: 200px;
  overflow-y: auto;
  background: var(--input-bg);
  border: 1px solid var(--glow);
  border-radius: 0 0 10px 10px;
  z-index: 10;
  display: none;
}

#joker-dropdown.open { display: block; }

.joker-option {
  padding: 0.6rem 1rem;
  cursor: pointer;
  font-size: 0.95rem;
  border-bottom: 1px solid rgba(179, 102, 255, 0.1);
}

.joker-option:hover, .joker-option.active {
  background: rgba(179, 102, 255, 0.15);
  color: var(--gold);
}

.wish-btn {
  background: linear-gradient(135deg, var(--glow), #8833cc);
  border: none;
  border-radius: 12px;
  padding: 0.9rem;
  color: white;
  font-family: inherit;
  font-size: 1.15rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 20px rgba(179, 102, 255, 0.3);
}

.wish-btn:hover:not(:disabled) {
  transform: scale(1.03);
  box-shadow: 0 6px 30px rgba(179, 102, 255, 0.5);
}

.wish-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.wish-btn.searching {
  animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 4px 20px rgba(179, 102, 255, 0.3); }
  50% { box-shadow: 0 4px 40px rgba(179, 102, 255, 0.7); }
}

#result-area {
  margin-top: 2rem;
  width: 90%;
  max-width: 460px;
  text-align: center;
}

.result-card {
  background: var(--card);
  border: 2px solid var(--gold);
  border-radius: 16px;
  padding: 2rem;
  animation: reveal 0.5s ease-out;
  box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
}

@keyframes reveal {
  from { opacity: 0; transform: scale(0.9) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.result-label {
  font-size: 0.85rem;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 0.5rem;
}

.result-seed {
  font-size: 2.5rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.15em;
  font-family: 'Courier New', monospace;
  word-break: break-all;
}

.result-details {
  margin-top: 1rem;
  font-size: 0.9rem;
  color: var(--dim);
}

.result-details span {
  color: var(--glow);
  font-weight: 600;
}

.result-time {
  margin-top: 0.75rem;
  font-size: 0.8rem;
  color: #5a5070;
}

#boot-status {
  margin-top: 1rem;
  font-size: 0.85rem;
  color: var(--dim);
}

.error {
  color: var(--red);
  background: rgba(233, 69, 96, 0.1);
  border: 1px solid rgba(233, 69, 96, 0.3);
  border-radius: 10px;
  padding: 1rem;
  font-size: 0.9rem;
}
</style>
</head>
<body>

<div class="lamp">🧞</div>
<h1>Balatro Genie</h1>
<p class="subtitle">wish for a seed, get a seed</p>

<div class="wish-box">
  <label>
    your joker
    <div class="joker-search-wrap">
      <input type="text" id="joker-input" placeholder="start typing... Blueprint, DNA, Perkeo..." autocomplete="off">
      <div id="joker-dropdown"></div>
    </div>
  </label>

  <label>
    your name <span style="font-weight:400; color:#5a5070">(optional — baked into the seed)</span>
    <input type="text" id="name-input" placeholder="up to 7 letters" maxlength="7">
  </label>

  <button class="wish-btn" id="wish-btn" disabled>loading engine...</button>
</div>

<div id="boot-status"></div>
<div id="result-area"></div>

<script type="module">
import bootsharp, { MotelyJaml, MotelySearch } from "motely-wasm";

const JOKERS = [
  "Joker","Greedy Joker","Lusty Joker","Wrathful Joker","Gluttonous Joker",
  "Jolly Joker","Zany Joker","Mad Joker","Crazy Joker","Droll Joker",
  "Sly Joker","Wily Joker","Clever Joker","Devious Joker","Crafty Joker",
  "Half Joker","Credit Card","Banner","Mystic Summit","8 Ball",
  "Misprint","Raised Fist","Chaos the Clown","Scary Face","Abstract Joker",
  "Delayed Gratification","Gros Michel","Even Steven","Odd Todd","Scholar",
  "Business Card","Supernova","Ride the Bus","Egg","Runner",
  "Ice Cream","Splash","Blue Joker","Faceless Joker","Green Joker",
  "Superposition","To Do List","Cavendish","Red Card","Square Joker",
  "Riff-Raff","Photograph","Reserved Parking","Mail-In Rebate","Hallucination",
  "Fortune Teller","Juggler","Drunkard","Golden Joker","Popcorn",
  "Walkie Talkie","Smiley Face","Golden Ticket","Swashbuckler","Hanging Chad",
  "Shoot the Moon","Joker Stencil","Four Fingers","Mime","Ceremonial Dagger",
  "Marble Joker","Loyalty Card","Dusk","Fibonacci","Steel Joker",
  "Hack","Pareidolia","Space Joker","Burglar","Blackboard",
  "Sixth Sense","Constellation","Hiker","Card Sharp","Madness",
  "Séance","Vampire","Shortcut","Hologram","Cloud 9",
  "Rocket","Midas Mask","Luchador","Gift Card","Turtle Bean",
  "Erosion","To the Moon","Stone Joker","Lucky Cat","Bull",
  "Diet Cola","Trading Card","Flash Card","Spare Trousers","Ramen",
  "Seltzer","Castle","Mr. Bones","Acrobat","Sock and Buskin",
  "Troubadour","Certificate","Smeared Joker","Throwback","Rough Gem",
  "Bloodstone","Arrowhead","Onyx Agate","Glass Joker","Showman",
  "Flower Pot","Merry Andy","Oops! All 6s","The Idol","Seeing Double",
  "Matador","Satellite","Cartomancer","Astronomer","Bootstraps",
  "DNA","Vagabond","Baron","Obelisk","Baseball Card",
  "Ancient Joker","Campfire","Blueprint","Wee Joker","Hit the Road",
  "The Duo","The Trio","The Family","The Order","The Tribe",
  "Stuntman","Invisible Joker","Brainstorm","Driver's License","Burnt Joker",
  "Canio","Triboulet","Yorick","Chicot","Perkeo"
];

const DISPLAY_TO_JAML = {};
JOKERS.forEach(j => {
  let pascal = j.replace(/[^a-zA-Z0-9 ]/g, "").split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join("");
  if (j === "8 Ball") pascal = "EightBall";
  if (j === "Chaos the Clown") pascal = "ChaostheClown";
  if (j === "Oops! All 6s") pascal = "OopsAll6s";
  if (j === "Riff-Raff") pascal = "RiffRaff";
  if (j === "Mail-In Rebate") pascal = "MailInRebate";
  if (j === "Mr. Bones") pascal = "MrBones";
  if (j === "Driver's License") pascal = "DriversLicense";
  if (j === "Séance") pascal = "Seance";
  DISPLAY_TO_JAML[j] = pascal;
});

const jokerInput = document.getElementById("joker-input");
const dropdown = document.getElementById("joker-dropdown");
const nameInput = document.getElementById("name-input");
const wishBtn = document.getElementById("wish-btn");
const bootStatus = document.getElementById("boot-status");
const resultArea = document.getElementById("result-area");

let selectedJoker = null;
let activeIdx = -1;

function renderDropdown(filter) {
  const matches = filter
    ? JOKERS.filter(j => j.toLowerCase().includes(filter.toLowerCase())).slice(0, 12)
    : JOKERS.slice(0, 12);

  if (matches.length === 0) {
    dropdown.classList.remove("open");
    return;
  }

  activeIdx = -1;
  dropdown.innerHTML = matches.map((j, i) =>
    `<div class="joker-option" data-joker="${j}" data-idx="${i}">${j}</div>`
  ).join("");
  dropdown.classList.add("open");

  dropdown.querySelectorAll(".joker-option").forEach(el => {
    el.addEventListener("mousedown", (e) => {
      e.preventDefault();
      pick(el.dataset.joker);
    });
  });
}

function pick(joker) {
  selectedJoker = joker;
  jokerInput.value = joker;
  dropdown.classList.remove("open");
}

jokerInput.addEventListener("focus", () => renderDropdown(jokerInput.value));
jokerInput.addEventListener("input", () => {
  selectedJoker = null;
  renderDropdown(jokerInput.value);
});
jokerInput.addEventListener("blur", () => {
  setTimeout(() => dropdown.classList.remove("open"), 150);
});
jokerInput.addEventListener("keydown", (e) => {
  const items = dropdown.querySelectorAll(".joker-option");
  if (!items.length) return;

  if (e.key === "ArrowDown") {
    e.preventDefault();
    activeIdx = Math.min(activeIdx + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle("active", i === activeIdx));
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    activeIdx = Math.max(activeIdx - 1, 0);
    items.forEach((el, i) => el.classList.toggle("active", i === activeIdx));
  } else if (e.key === "Enter" && activeIdx >= 0) {
    e.preventDefault();
    pick(items[activeIdx].dataset.joker);
  }
});

nameInput.addEventListener("input", () => {
  // Balatro's seed alphabet is 1-9 + A-Z: no zero, so map 0 → O
  nameInput.value = nameInput.value.toUpperCase().replace(/0/g, "O").replace(/[^A-Z1-9]/g, "");
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
}

// Typed joker names match regardless of case and punctuation:
// "triboulet", "mr bones", "oops all 6s" all resolve.
function resolveJoker(text) {
  const norm = s => s.normalize("NFD").toLowerCase().replace(/[^a-z0-9]/g, "");
  const t = norm(text);
  if (!t) return null;
  const exact = JOKERS.find(j => norm(j) === t);
  if (exact) return exact;
  const partial = JOKERS.filter(j => norm(j).includes(t));
  return partial.length === 1 ? partial[0] : null;
}

bootStatus.textContent = "waking the genie...";
try {
  await bootsharp.boot();
  bootStatus.textContent = "";
  wishBtn.textContent = "make a wish ✨";
  wishBtn.disabled = false;
} catch (e) {
  bootStatus.textContent = "";
  wishBtn.textContent = "engine failed to load";
  resultArea.innerHTML = `<div class="error">the genie's lamp is cracked: ${esc(e.message || e)}<br>reload the page to try again</div>`;
  throw e;
}

const ALPHABET = "123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const SEED_LEN = 8;
const CANDIDATE_CAP = 50000;

// Every 8-char seed containing `name` is name + padding at some position.
// Enumerate them all when the space is small; sample it when it isn't.
function candidateSeeds(name, cap) {
  const padLen = SEED_LEN - name.length;
  const positions = padLen + 1;
  const total = positions * Math.pow(ALPHABET.length, padLen);
  const seeds = new Set();

  if (total <= cap) {
    const padCount = Math.pow(ALPHABET.length, padLen);
    for (let pos = 0; pos < positions; pos++) {
      for (let i = 0; i < padCount; i++) {
        let x = i, pad = "";
        for (let d = 0; d < padLen; d++) {
          pad += ALPHABET[x % ALPHABET.length];
          x = Math.floor(x / ALPHABET.length);
        }
        seeds.add(pad.slice(0, pos) + name + pad.slice(pos));
      }
    }
    return { seeds: [...seeds], exhaustive: true };
  }

  let guard = cap * 3;
  while (seeds.size < cap && guard-- > 0) {
    const pos = Math.floor(Math.random() * positions);
    let pad = "";
    for (let d = 0; d < padLen; d++) {
      pad += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
    }
    seeds.add(pad.slice(0, pos) + name + pad.slice(pos));
  }
  return { seeds: [...seeds], exhaustive: false };
}

function buildJaml(pascal, antes, seedList) {
  return [
    `name: Genie Wish`,
    `deck: Red`,
    `stake: White`,
    seedList ? `seeds: [${seedList.join(", ")}]` : ``,
    `must:`,
    `  - joker: ${pascal}`,
    `    antes: [${antes.join(", ")}]`,
  ].filter(Boolean).join("\n");
}

async function searchSeedList(seedList, pascal, antes) {
  const CHUNK = 2500;
  for (let i = 0; i < seedList.length; i += CHUNK) {
    const config = MotelyJaml.fromJaml(buildJaml(pascal, antes, seedList.slice(i, i + CHUNK)));
    const results = await MotelySearch.searchList(config);
    if (results.length > 0) return results;
    bootStatus.textContent = `checked ${Math.min(i + CHUNK, seedList.length)} of ${seedList.length} seeds with your name...`;
  }
  return [];
}

wishBtn.addEventListener("click", async () => {
  const typed = jokerInput.value.trim();
  if (!selectedJoker && !typed) {
    jokerInput.focus();
    return;
  }

  const joker = selectedJoker || resolveJoker(typed);
  if (!joker) {
    resultArea.innerHTML = `<div class="error">unknown joker: "${esc(typed)}" — pick one from the list</div>`;
    return;
  }
  const pascal = DISPLAY_TO_JAML[joker];

  const keyword = nameInput.value.trim();

  wishBtn.disabled = true;
  wishBtn.textContent = "the genie stirs...";
  wishBtn.classList.add("searching");
  resultArea.innerHTML = "";

  const onProgress = p => {
    const m = Number(p.seedsSearched) / 1e6;
    if (m >= 0.1) wishBtn.textContent = `searching... ${m.toFixed(1)}M seeds`;
  };
  MotelySearch.onProgress.subscribe(onProgress);

  const t0 = performance.now();

  try {
    let results;
    let anteNote = "guaranteed in antes 1–2";

    if (keyword) {
      const { seeds, exhaustive } = candidateSeeds(keyword, CANDIDATE_CAP);
      bootStatus.textContent = exhaustive
        ? `only ${seeds.length} seeds can contain "${keyword}" — checking every one...`
        : `checking ${seeds.length} seeds containing "${keyword}"...`;

      results = await searchSeedList(seeds, pascal, [1, 2]);

      if (results.length === 0 && exhaustive) {
        bootStatus.textContent = `none in antes 1–2 — widening to antes 1–8...`;
        results = await searchSeedList(seeds, pascal, [1, 2, 3, 4, 5, 6, 7, 8]);
        anteNote = "appears within antes 1–8";
      }

      if (results.length === 0) {
        const detail = exhaustive
          ? `all ${seeds.length} seeds containing "${esc(keyword)}" checked — none has ${esc(joker)} even by ante 8. try fewer letters.`
          : `checked ${seeds.length} seeds containing "${esc(keyword)}" — no ${esc(joker)} in antes 1–2. wish again for a fresh batch, or try fewer letters.`;
        resultArea.innerHTML = `<div class="error">${detail}</div>`;
      }
    } else {
      const config = MotelyJaml.fromJaml(buildJaml(pascal, [1, 2]));
      results = await MotelySearch.findOne(config);
      if (results.length === 0) {
        resultArea.innerHTML = `<div class="error">the genie found nothing — try again or pick a different joker</div>`;
      }
    }

    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);

    if (results.length > 0) {
      const best = results.reduce((a, b) => a.score >= b.score ? a : b);
      resultArea.innerHTML = `
        <div class="result-card">
          <div class="result-label">your seed</div>
          <div class="result-seed">${esc(best.seed)}</div>
          <div class="result-details">
            <span>${esc(joker)}</span> ${anteNote}
          </div>
          <div class="result-time">found in ${elapsed}s</div>
        </div>
      `;
    }
  } catch (e) {
    resultArea.innerHTML = `<div class="error">${esc(e.message || e)}</div>`;
  }

  MotelySearch.onProgress.unsubscribe(onProgress);
  bootStatus.textContent = "";
  wishBtn.classList.remove("searching");
  wishBtn.textContent = "make a wish ✨";
  wishBtn.disabled = false;
});
</script>
</body>
</html>
