<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Balatro Genie</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
h1 { color: #e94560; margin-bottom: 1rem; }
textarea { width: 100%; max-width: 600px; height: 200px; background: #16213e; color: #e0e0e0; border: 1px solid #e94560; border-radius: 8px; padding: 1rem; font-family: monospace; font-size: 14px; resize: vertical; }
button { margin-top: 1rem; padding: 0.75rem 2rem; background: #e94560; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button:hover:not(:disabled) { background: #c73650; }
#status { margin-top: 1rem; font-size: 14px; color: #a0a0a0; }
#results { margin-top: 1rem; width: 100%; max-width: 600px; }
.seed { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
.seed-id { font-family: monospace; font-size: 18px; color: #e94560; font-weight: bold; }
.seed-score { color: #a0a0a0; font-size: 14px; }
</style>
</head>
<body>
<h1>Balatro Genie</h1>
<textarea id="jaml" spellcheck="false">name: Quick search
deck: Red
stake: White
must:
  - voucher: Overstock
    antes: [1]
</textarea>
<button id="go" disabled>Booting engine...</button>
<div id="status"></div>
<div id="results"></div>

<script type="module">
import bootsharp, { MotelyJaml, MotelySearch } from "./node_modules/motely-wasm/dist/index.mjs";

const btn = document.getElementById("go");
const status = document.getElementById("status");
const results = document.getElementById("results");
const jamlEl = document.getElementById("jaml");
let searching = false;

MotelySearch.onProgress.subscribe((p) => {
  status.textContent = `Searched: ${p.seedsSearched.toLocaleString()} | Matches: ${p.matchingSeeds.toLocaleString()}`;
});

MotelySearch.onScoredResult.subscribe((r) => {
  const div = document.createElement("div");
  div.className = "seed";
  div.innerHTML = `<span class="seed-id">${r.seed}</span><span class="seed-score">score: ${r.score}</span>`;
  results.prepend(div);
});

await bootsharp.boot();
btn.textContent = "Find Seeds";
btn.disabled = false;

btn.addEventListener("click", async () => {
  if (searching) return;
  searching = true;
  results.innerHTML = "";
  btn.disabled = true;
  btn.textContent = "Searching...";
  status.textContent = "Starting...";

  try {
    const config = MotelyJaml.fromJaml(jamlEl.value);
    const found = await MotelySearch.findOne(config);
    status.textContent = `Done — ${found.length} seed(s) found.`;
  } catch (e) {
    status.textContent = `Error: ${e.message || e}`;
  }

  btn.textContent = "Find Seeds";
  btn.disabled = false;
  searching = false;
});
</script>
</body>
</html>
