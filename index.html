<title>Balatro Genie — Seed Searcher</title>
<meta name="description" content="Minimalist client-side Balatro seed searcher. Write a JAML filter, search 2.25 trillion seeds in your browser. No build, no backend — the engine streams from a CDN." />

<!-- No bundle: React/htm from esm.sh, the motely-wasm engine from jsDelivr.
     The multi-MB embedded WASM ships from the CDN, not from this origin, so
     the deploy is a few KB of HTML and egress stays near zero. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19",
    "react-dom": "https://esm.sh/react-dom@19",
    "react-dom/client": "https://esm.sh/react-dom@19/client",
    "htm": "https://esm.sh/htm@3.1.1",
    "motely-wasm": "https://cdn.jsdelivr.net/npm/motely-wasm@21.2.0/dist/index.mjs",
    "motely-wasm/motely/wasm": "https://cdn.jsdelivr.net/npm/motely-wasm@21.2.0/dist/generated/modules/motely/wasm.g.mjs",
    "motely-wasm/motely/enums": "https://cdn.jsdelivr.net/npm/motely-wasm@21.2.0/dist/generated/modules/motely/enums.g.mjs",

<style>
:root {
  --bg: #0b1413; --panel: #11191a; --border: #21302f;
  --text: #d8ecdf; --muted: #6f8a82;
  --gold: #f6c945; --red: #fe5148; --green: #56a786;
  --orange: #ff9800; --blue: #4aa3df; --purple: #9b6dc4; --grey: #3a4a48;
  --mono: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.app { max-width: 620px; margin: 0 auto; padding: 28px 18px 48px; display: grid; gap: 14px; }
.head { text-align: center; }
.title { margin: 0; font-size: 30px; }
.genie { filter: drop-shadow(0 0 8px rgba(155, 109, 196, 0.6)); }
.tagline { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.statusbar, .toolbar, .presets { display: grid; grid-auto-flow: column; justify-content: center; gap: 8px; }
.badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  padding: 4px 9px; border-radius: 999px; color: #0b1413; white-space: nowrap; }
.badge-grey { background: var(--grey); color: var(--text); }
.badge-green { background: var(--green); }
.badge-orange { background: var(--orange); }
.badge-red { background: var(--red); }
.badge-blue { background: var(--blue); }
.badge-purple { background: var(--purple); }
.badge-gold { background: var(--gold); }
.chip { background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
.chip:hover:not(:disabled) { border-color: var(--gold); }
.chip:disabled { opacity: 0.5; cursor: not-allowed; }
.editor { width: 100%; min-height: 200px; resize: vertical; background: var(--panel); color: var(--text);
  border: 2px solid var(--border); border-radius: 10px; padding: 12px;
  font-family: var(--mono); font-size: 13px; line-height: 1.55; }
.editor:focus { outline: none; border-color: var(--green); }
.editor:disabled { opacity: 0.7; }

  border-radius: 10px; padding: 10px 12px; font-size: 13px; font-family: var(--mono); white-space: pre-wrap; }

  letter-spacing: 0.02em; cursor: pointer; background: var(--orange); color: #0b1413; }

  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.seed { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px; cursor: pointer; }
.seed:hover { border-color: var(--gold); }

<body>
<div id="root"></div>

<script type="module">
import { createElement, useCallback, useEffect, useRef, useState } from "react";
import { createRoot } from "react-dom/client";
import htm from "htm";
import bootsharp from "motely-wasm";
import { Program } from "motely-wasm/motely/wasm";

// htm binds to a hyperscript fn — React.createElement — so we get JSX-like
// markup with no build step.
const html = htm.bind(createElement);

// ---------------------------------------------------------------------------
// seeds: read / strip / write the top-level `seeds:` list in a JAML filter.
// We manage it ourselves so the search can re-score saved seeds first and write
// the best finds back. Always stripped before fromJaml; supplied via config.seeds.
// ---------------------------------------------------------------------------
const STRIP_QUOTES = /^["']|["']$/g;
const ZONE_KEY = /^\s*(must|should|mustNot)\s*:/;

function parseSeeds(jaml) {
  const lines = jaml.split(/\r?\n/);
  const seeds = [];
  for (let i = 0; i < lines.length; i++) {
    const header = lines[i].match(/^\s*seeds\s*:\s*(.*)$/);
    if (!header) continue;
    const inline = header[1].trim();
    if (inline.startsWith("[")) {
      let buf = inline, j = i;
      while (!buf.includes("]") && j + 1 < lines.length) { j++; buf += " " + lines[j].trim(); }
      const inner = buf.slice(buf.indexOf("[") + 1, buf.lastIndexOf("]"));
      for (const tok of inner.split(",")) {
        const s = tok.trim().replace(STRIP_QUOTES, "").toUpperCase();
        if (s) seeds.push(s);
      }
    } else {
      for (let k = i + 1; k < lines.length; k++) {
        const item = lines[k].match(/^\s*-\s*(.+?)\s*$/);
        if (!item) break;
        const s = item[1].replace(STRIP_QUOTES, "").toUpperCase();
        if (s) seeds.push(s);
      }
    }
    break;
  }
  return [...new Set(seeds)];
}

function stripSeeds(jaml) {
  const lines = jaml.split(/\r?\n/);
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const header = lines[i].match(/^\s*seeds\s*:\s*(.*)$/);
    if (!header) { out.push(lines[i]); continue; }
    const inline = header[1].trim();
    if (inline.startsWith("[")) {
      let buf = inline;
      while (!buf.includes("]") && i + 1 < lines.length) { i++; buf += lines[i]; }
    } else {
      while (i + 1 < lines.length && /^\s*-\s+/.test(lines[i + 1])) i++;
    }
  }
  return out.join("\n");
}

function writeSeeds(jaml, seeds) {
  const base = stripSeeds(jaml).replace(/\n{3,}/g, "\n\n").trimEnd();
  if (seeds.length === 0) return base + "\n";
  const flow = `seeds: [${seeds.join(", ")}]`;
  const lines = base.split(/\r?\n/);
  const zoneIdx = lines.findIndex((l) => ZONE_KEY.test(l));
  if (zoneIdx === -1) return base + "\n" + flow + "\n";
  lines.splice(zoneIdx, 0, flow);
  return lines.join("\n") + "\n";
}

function readName(jaml) {
  const m = jaml.match(/^\s*name\s*:\s*(.+?)\s*$/m);
  return m ? (m[1].replace(STRIP_QUOTES, "").trim() || null) : null;
}

// ---------------------------------------------------------------------------
// engine: boot + two-phase search (seedlist re-score, then full sweep), keeping
// the best MAX_BEST seeds by score for the ratchet.
// ---------------------------------------------------------------------------
let bootPromise = null;
function bootEngine() {
  if (bootPromise) return bootPromise;
  bootPromise = (async () => {
    // Embedded build: WASM is base64-inlined, boot() takes no args.
    if (bootsharp.getStatus() === bootsharp.BootStatus.Standby) await bootsharp.boot();
  })();
  return bootPromise;
}

function validateJaml(jaml) {
  try { Program.fromJaml(stripSeeds(jaml)); return null; }
  catch (e) { return e instanceof Error ? e.message : String(e); }
}

const MAX_BEST = 3141; // π.
// Balatro seeds: 8 chars over a 35-char alphabet -> 35^8 ~ 2.25 trillion.
const BATCH_CHARS = 3;
const TOTAL_BATCHES = Math.pow(35, 8 - BATCH_CHARS); // 35^5 = 52,521,875
const BATCHES_PER_RANGE = 4;

function runSearch(jaml, cb) {
  const presetSeeds = parseSeeds(jaml);
  const config = Program.fromJaml(stripSeeds(jaml));
  let stopped = false;

  let best = new Map();
  let lastBestEmit = 0;
  const topSeeds = () =>
    [...best.entries()].sort((a, b) => b[1] - a[1]).slice(0, MAX_BEST).map(([s]) => s);
  const emitBest = (force) => {
    const now = performance.now();
    if (!force && now - lastBestEmit < 1500) return;
    lastBestEmit = now;
    const top = topSeeds();
    if (best.size > MAX_BEST) best = new Map(top.map((s) => [s, best.get(s)]));
    cb.onBest(top);
  };

  const onScored = (r) => {
    const prev = best.get(r.seed);
    if (prev === undefined || r.score > prev) best.set(r.seed, r.score);
    cb.onHit({ seed: r.seed, score: r.score });
    emitBest(false);
  };
  Program.onScoredResult.subscribe(onScored);

  const done = (async () => {
    let scanned = 0, hits = 0;
    const started = performance.now();
    const report = () => {
      const sec = (performance.now() - started) / 1000;
      cb.onProgress({ scanned, hits, seedsPerSecond: sec > 0 ? Math.round(scanned / sec) : 0 });
    };
    try {
      // Phase 1 — re-score the seeds already saved in the filter.
      if (presetSeeds.length > 0 && !stopped) {
        cb.onPhase("seedlist");
        config.seeds = presetSeeds;
        await new Promise((res) => setTimeout(res, 0));
        const run = Program.runSeedListSearch(config);
        scanned += Number(run.totalSeedsSearched);
        hits += Number(run.matchingSeeds);
        report(); emitBest(true);
      }
      // Phase 2 — continue sweeping the full space.
      config.seeds = [];
      cb.onPhase("sweep");
      let cursor = Math.floor(Math.random() * TOTAL_BATCHES);
      let covered = 0;
      while (covered < TOTAL_BATCHES && !stopped) {
        await new Promise((res) => setTimeout(res, 0)); // yield: paint + Stop land
        const end = Math.min(cursor + BATCHES_PER_RANGE, TOTAL_BATCHES);
        // progressReportIntervalMs MUST be passed (a bigint) — omitting this
        // optional marshals `undefined` where the AOT engine expects a long and
        // throws the opaque "C# exception from NativeAOT". 100n gives the engine
        // the progress ticks autoScoreCutoff needs to engage: on a hit-heavy
        // filter it auto-raises the score bar as better seeds surface, so weak
        // hits stop firing and the ratchet fills with the best. Matches
        // seedfinder's browser-verified auto-cutoff sweep call.
        const run = Program.runSequentialSearch(config, BigInt(cursor), BigInt(end), BATCH_CHARS, 100n, true);
        scanned += Number(run.totalSeedsSearched);
        hits += Number(run.matchingSeeds);
        covered += end - cursor;
        cursor = end >= TOTAL_BATCHES ? 0 : end;
        report();
      }
    } finally {
      Program.onScoredResult.unsubscribe(onScored);
      report(); emitBest(true);
    }
  })();

  return { done, stop: () => { stopped = true; } };
}

// ---------------------------------------------------------------------------
// 🎲 Magic: aesthetic search. runAestheticSearch is ONE long synchronous
// enumeration (no batch/yield param), so on the main thread it would freeze the
// UI with no way to Stop. We run it in a Web Worker instead: results stream back
// via postMessage, and Stop just terminates the worker. Module workers don't
// inherit the page importmap, but motely-wasm's internal imports are all
// relative, so absolute CDN URLs for the two entry modules resolve everything.
// ---------------------------------------------------------------------------
const CDN_MOTELY = "https://cdn.jsdelivr.net/npm/motely-wasm@21.2.0/dist/index.mjs";
const CDN_WASM = "https://cdn.jsdelivr.net/npm/motely-wasm@21.2.0/dist/generated/modules/motely/wasm.g.mjs";

// JamlAesthetic enum order (motely/filters/jaml): the magic the engine can chase.
const AESTHETICS = [
  { name: "Palindrome", value: 0 },
  { name: "Echo", value: 1 },
  { name: "Gross", value: 2 },
  { name: "Funny", value: 3 },
  { name: "Balatro", value: 4 },
];

// Built as a line array (no backticks) so the worker body can't terminate this
// module's template literals.
const WORKER_SRC = [
  'import bootsharp from "' + CDN_MOTELY + '";',
  'import { Program } from "' + CDN_WASM + '";',
  'self.onmessage = async (e) => {',
  '  const { jaml, aesthetic } = e.data;',
  '  try {',
  '    if (bootsharp.getStatus() === bootsharp.BootStatus.Standby) await bootsharp.boot();',
  '    const config = Program.fromJaml(jaml);',
  '    Program.onScoredResult.subscribe((r) => self.postMessage({ t: "hit", seed: r.seed, score: r.score }));',
  '    Program.onProgress.subscribe((p) => self.postMessage({ t: "prog", scanned: Number(p.seedsSearched), hits: Number(p.matchingSeeds), sps: Math.round((p.seedsPerMillisecond || 0) * 1000) }));',
  '    const run = Program.runAestheticSearch(config, aesthetic);',
  '    self.postMessage({ t: "done", scanned: Number(run.totalSeedsSearched), hits: Number(run.matchingSeeds) });',
  '  } catch (err) {',
  '    self.postMessage({ t: "err", message: String((err && err.message) || err) });',
  '  }',
  '};',
].join("\n");

function runMagicSearch(jaml, aesthetic, cb) {
  const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
  const worker = new Worker(url, { type: "module" });

  let best = new Map();
  let lastBestEmit = 0;
  const emitBest = (force) => {
    const now = performance.now();
    if (!force && now - lastBestEmit < 1500) return;
    lastBestEmit = now;
    const top = [...best.entries()].sort((a, b) => b[1] - a[1]).slice(0, MAX_BEST).map(([s]) => s);
    if (best.size > MAX_BEST) best = new Map(top.map((s) => [s, best.get(s)]));
    cb.onBest(top);
  };

  let resolveDone;
  const done = new Promise((res) => { resolveDone = res; });
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    try { worker.terminate(); } catch (_) {}
    URL.revokeObjectURL(url);
    emitBest(true);
    resolveDone();
  };

  worker.onmessage = (e) => {
    const d = e.data;
    if (d.t === "hit") {
      const prev = best.get(d.seed);
      if (prev === undefined || d.score > prev) best.set(d.seed, d.score);
      cb.onHit({ seed: d.seed, score: d.score });
      emitBest(false);
    } else if (d.t === "prog") {
      cb.onProgress({ scanned: d.scanned, hits: d.hits, seedsPerSecond: d.sps });
    } else if (d.t === "done") {
      cb.onProgress({ scanned: d.scanned, hits: d.hits, seedsPerSecond: 0 });
      finish();
    } else if (d.t === "err") {
      cb.onError(d.message);
      finish();
    }
  };
  worker.onerror = (ev) => { cb.onError(ev.message || "worker error"); finish(); };

  // Strip saved seeds; magic runs the filter over the aesthetic enumeration.
  worker.postMessage({ jaml: stripSeeds(jaml), aesthetic });

  return { done, stop: finish };
}

// ---------------------------------------------------------------------------
// presets
// ---------------------------------------------------------------------------
const PRESETS = [
  { label: "Blueprint", jaml: `name: Blueprint Start\ndeck: Red\nstake: White\nmust:\n  - joker: Blueprint\n    antes: [1, 2]\n` },
  { label: "Perkeo + copies", jaml: `name: Perkeo Start\ndeck: Red\nstake: White\nmust:\n  - joker: Perkeo\n    antes: [1]\nshould:\n  - joker: Blueprint\n    antes: [1, 2, 3, 4]\n    score: 30\n  - joker: Brainstorm\n    antes: [1, 2, 3, 4]\n    score: 30\n` },
  { label: "Negative tag", jaml: `name: Early Negative\ndeck: Red\nstake: White\nmust:\n  - tag: NegativeTag\n    antes: [1, 2]\n` },
  { label: "Perkeo a1-3", jaml: `name: Perkeo Required\ndeck: Red\nstake: White\nmust:\n  - joker: Perkeo\n    antes: [1, 2, 3]\nshould:\n  - joker: Blueprint\n    antes: [1, 2, 3, 4]\n    score: 20\n  - joker: Brainstorm\n    antes: [1, 2, 3, 4]\n    score: 20\n` },
];
const DEFAULT_JAML = PRESETS[0].jaml;
const MAX_ROWS = 50;

// ---------------------------------------------------------------------------
// App
// ---------------------------------------------------------------------------
function App() {
  const [boot, setBoot] = useState("booting");
  const [bootError, setBootError] = useState(null);
  const [jaml, setJaml] = useState(DEFAULT_JAML);
  const [running, setRunning] = useState(false);
  const [phase, setPhase] = useState(null);
  const [magic, setMagic] = useState(null);
  const [error, setError] = useState(null);
  const [results, setResults] = useState([]);
  const [stats, setStats] = useState({ scanned: 0, hits: 0, seedsPerSecond: 0 });
  const [bestCount, setBestCount] = useState(0);
  const [copied, setCopied] = useState(null);

  const handleRef = useRef(null);
  const fileRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    bootEngine().then(
      () => { if (!cancelled) setBoot("ready"); },
      (e) => { if (!cancelled) { setBoot("error"); setBootError(e instanceof Error ? e.message : String(e)); } },
    );
    return () => { cancelled = true; handleRef.current?.stop(); };
  }, []);

  const onSearch = useCallback(async () => {
    if (boot !== "ready" || running) return;
    const v = validateJaml(jaml);
    if (v) { setError(v); return; }
    setError(null); setResults([]); setStats({ scanned: 0, hits: 0, seedsPerSecond: 0 }); setRunning(true);

    const found = [];
    let lastPaint = 0;
    const paint = (force) => {
      const now = performance.now();
      if (!force && now - lastPaint < 120) return;
      lastPaint = now;
      found.sort((a, b) => b.score - a.score);
      setResults(found.slice(0, MAX_ROWS));
    };

    try {
      const handle = runSearch(jaml, {
        onHit: (hit) => { found.push(hit); paint(false); },
        onProgress: setStats,
        onPhase: setPhase,
        onBest: (seeds) => { setBestCount(seeds.length); setJaml((prev) => writeSeeds(prev, seeds)); },
      });
      handleRef.current = handle;
      await handle.done;
      paint(true);
    } catch (e) {
      setError(e instanceof Error ? e.message : String(e));
    } finally {
      handleRef.current = null; setPhase(null); setRunning(false);
    }
  }, [boot, running, jaml]);

  const onMagic = useCallback(async () => {
    if (boot !== "ready" || running) return;
    const v = validateJaml(jaml);
    if (v) { setError(v); return; }
    const pick = AESTHETICS[Math.floor(Math.random() * AESTHETICS.length)];
    setError(null); setResults([]); setStats({ scanned: 0, hits: 0, seedsPerSecond: 0 });
    setMagic(pick.name); setRunning(true);

    const found = [];
    let lastPaint = 0;
    const paint = (force) => {
      const now = performance.now();
      if (!force && now - lastPaint < 120) return;
      lastPaint = now;
      found.sort((a, b) => b.score - a.score);
      setResults(found.slice(0, MAX_ROWS));
    };

    try {
      const handle = runMagicSearch(jaml, pick.value, {
        onHit: (hit) => { found.push(hit); paint(false); },
        onProgress: setStats,
        onBest: (seeds) => { setBestCount(seeds.length); setJaml((prev) => writeSeeds(prev, seeds)); },
        onError: (m) => setError(m),
      });
      handleRef.current = handle;
      await handle.done;
      paint(true);
    } catch (e) {
      setError(e instanceof Error ? e.message : String(e));
    } finally {
      handleRef.current = null; setMagic(null); setRunning(false);
    }
  }, [boot, running, jaml]);

  const onStop = useCallback(() => { handleRef.current?.stop(); }, []);

  const onLoadFile = useCallback((e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { setJaml(String(reader.result ?? "")); setBestCount(0); setResults([]); setError(null); };
    reader.readAsText(file);
  }, []);

  const onSaveFile = useCallback(() => {
    const blob = new Blob([jaml], { type: "text/yaml" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${(readName(jaml) ?? "balatro-filter").replace(/[^\w.-]+/g, "-")}.jaml`;
    a.click();
    URL.revokeObjectURL(url);
  }, [jaml]);

  const onCopy = useCallback((seed) => {
    navigator.clipboard?.writeText(seed).then(
      () => { setCopied(seed); setTimeout(() => setCopied((s) => (s === seed ? null : s)), 1200); },
      () => {},
    );
  }, []);

  const statusLabel = boot === "booting" ? "booting engine…"
    : boot === "error" ? "engine error"
    : running ? (magic ? "✨ " + magic + " magic" : phase === "seedlist" ? "re-scoring saved seeds" : "sweeping")
    : "ready";
  const statusTone = boot === "error" ? "red" : running ? "orange" : boot === "ready" ? "green" : "grey";

  return html`
    <main className="app">
      <header className="head">
        <h1 className="title"><span className="genie">🧞</span> Balatro Genie</h1>
        <p className="tagline">Client-side seed search · 2.25 trillion seeds, all in your browser</p>
      </header>

      <div className="statusbar">
        <span className=${"badge badge-" + statusTone}>${statusLabel}</span>
        <span className="badge badge-blue">${stats.seedsPerSecond.toLocaleString()}/s</span>
        <span className="badge badge-purple">${stats.hits.toLocaleString()} hits</span>
        <span className="badge badge-gold">★ ${bestCount.toLocaleString()}/${MAX_BEST}</span>
      </div>

      <div className="toolbar">
        <button type="button" className="chip" disabled=${running} onClick=${() => fileRef.current?.click()}>📂 Load .jaml</button>
        <button type="button" className="chip" onClick=${onSaveFile}>💾 Save .jaml</button>
        <input ref=${fileRef} type="file" accept=".jaml,.yaml,.yml,.txt,text/yaml" hidden onChange=${onLoadFile} />
      </div>

      <div className="presets">
        ${PRESETS.map((p) => html`
          <button key=${p.label} type="button" className="chip" disabled=${running}
            onClick=${() => { setJaml(p.jaml); setBestCount(0); }}>${p.label}</button>`)}
      </div>

      <textarea className="editor" spellCheck=${false} value=${jaml} disabled=${running}
        onChange=${(e) => setJaml(e.target.value)} placeholder="Write a JAML filter…"></textarea>

      ${boot === "error" && bootError ? html`<p className="error">Engine failed to boot: ${bootError}</p>` : null}
      ${error ? html`<p className="error">${error}</p>` : null}

      ${running
        ? html`<button type="button" className="run run-stop" onClick=${onStop}>Stop</button>`
        : html`<div className="runrow">
            <button type="button" className="run" disabled=${boot !== "ready"} onClick=${onSearch}>${boot === "ready" ? "Search Seeds" : "Booting…"}</button>
            <button type="button" className="run run-magic" disabled=${boot !== "ready"} onClick=${onMagic} title="Search a random aesthetic: Palindrome · Echo · Gross · Funny · Balatro">🎲 Magic</button>
          </div>`}

      ${results.length > 0 ? html`
        <ul className="results">
          ${results.map((r) => html`
            <li key=${r.seed} className="seed" title="Click to copy" onClick=${() => onCopy(r.seed)}>
              <span className="seed-id">${r.seed}</span>
              <span className="seed-score">${copied === r.seed ? "copied!" : r.score}</span>
            </li>`)}
        </ul>` : null}

      <footer className="foot">
        Powered by <a href="https://www.npmjs.com/package/motely-wasm" target="_blank" rel="noreferrer">motely-wasm</a>
        · JAML via <a href="https://mcp.seedfinder.app/mcp" target="_blank" rel="noreferrer">seedfinder.app</a>
      </footer>
    </main>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
