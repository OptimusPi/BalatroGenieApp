<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Balatro Genie</title>

<link rel="stylesheet" href="https://esm.sh/jaml-ui@4.4.0/fonts.css" />
<link rel="stylesheet" href="https://esm.sh/jaml-ui@4.4.0/jimbo.css" />

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "motely-wasm": "https://esm.sh/motely-wasm@25.0.3",
    "htm/react": "https://esm.sh/htm@3.1.1/react?external=react",
    "jaml-ui": "https://esm.sh/jaml-ui@4.4.0?external=react,react-dom,motely-wasm"
  }
}
</script>

<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: var(--j-bg, #14181c); }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { useCallback, useState } from "react";
import { createRoot } from "react-dom/client";
import htm from "htm/react";
import bootsharp, { MotelyJaml, MotelySearch } from "motely-wasm";
import { JimboBackground, JimboApp, JamlIde, JimboErrorBlock } from "jaml-ui";

const html = htm;

// One document is the whole search. Root keys are the engine's:
// id, name, description, author, dateCreated, deck, stake, seeds, filter, must, should, mustNot
const STARTER = `name: Showman early + Perkeo
deck: Anaglyph
stake: White
must:
  - joker: Showman
    antes: [1, 2, 3]
should:
  - joker: Perkeo
    antes: [1, 2, 3, 4, 5, 6, 7, 8]
`;

const BATCH = 2000;

function Genie() {
  const [jaml, setJaml] = useState(STARTER);
  const [hits, setHits] = useState([]);
  const [searching, setSearching] = useState(false);
  const [error, setError] = useState(null);

  const onSearch = useCallback(async () => {
    if (searching) return;
    setError(null);
    setSearching(true);
    try {
      if (bootsharp.getStatus() !== bootsharp.BootStatus.Booted) await bootsharp.boot();
      const bad = MotelyJaml.validate(jaml);
      if (bad && bad !== "valid") throw new Error(bad);
      const results = await MotelySearch.searchRandom(MotelyJaml.fromJaml(jaml), BATCH);
      // Every hit, ranked. Not one seed.
      setHits(
        [...results]
          .map((r) => ({ seed: r.seed, score: r.score ?? 0, tallies: r.tallies }))
          .sort((a, b) => b.score - a.score)
      );
    } catch (e) {
      setError(e instanceof Error ? e.message : String(e));
    } finally {
      setSearching(false);
    }
  }, [jaml, searching]);

  const onLoadFile = useCallback(async () => {
    return new Promise((resolve) => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".jaml,.yaml,.yml,.txt";
      input.onchange = async () => {
        const file = input.files && input.files[0];
        resolve(file ? await file.text() : null);
      };
      input.oncancel = () => resolve(null);
      input.click();
    });
  }, []);

  const subtitle = searching
    ? `searching ${BATCH.toLocaleString()} seeds`
    : hits.length
      ? `${hits.length.toLocaleString()} seeds, ranked`
      : "one line is valid JAML";

  return html`
    <${JimboBackground}>
      <${JimboApp} variant="page">
        ${error && html`<${JimboErrorBlock} key="err">${error}<//>`}
        <${JamlIde}
          jaml=${jaml}
          onChange=${setJaml}
          onSearch=${onSearch}
          isSearching=${searching}
          showLoadFileButton
          onLoadFile=${onLoadFile}
          title="Balatro Genie"
          subtitle=${subtitle}
          searchResults=${hits.map((h) => ({
            seed: h.seed,
            score: h.score,
            tallyColumns: h.tallies,
          }))}
        />
      <//>
    <//>
  `;
}

createRoot(document.getElementById("root")).render(html`<${Genie} />`);
</script>
</body>
</html>
